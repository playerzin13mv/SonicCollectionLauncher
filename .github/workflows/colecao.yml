name: Build Sonic Origins Mobile (Android APK)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Baixar dependencias Android (SDL2, libogg, libvorbis)
        run: |
          set -e
          . "$GITHUB_WORKSPACE/.github/baixar.sh"
          cd dependencies/android

          baixar sdl.zip "" \
            https://github.com/libsdl-org/SDL/releases/download/release-2.28.3/SDL2-2.28.3.zip
          unzip -q sdl.zip
          rm -rf SDL
          mv SDL2-2.28.3 SDL

          baixar ogg.tar.gz "" \
            https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.gz \
            https://github.com/xiph/ogg/releases/download/v1.3.5/libogg-1.3.5.tar.gz
          tar xzf ogg.tar.gz
          rm -rf libogg
          mv libogg-1.3.5 libogg
          cp config_types.h libogg/include/ogg/config_types.h

          baixar vorbis.tar.gz 0e982409a9c3fc82ee06e08205b1355e5c6aa4c36bca58146ef399621b0ce5ab \
            https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.gz \
            https://github.com/xiph/vorbis/releases/download/v1.3.7/libvorbis-1.3.7.tar.gz \
            https://ftp.osuosl.org/pub/xiph/releases/vorbis/libvorbis-1.3.7.tar.gz
          tar xzf vorbis.tar.gz
          rm -rf libvorbis
          mv libvorbis-1.3.7 libvorbis
          ls

      - name: Criar link SDL dentro de android/app/jni
        run: |
          cd android/app/jni
          rm -rf SDL
          ln -s ../../../dependencies/android/SDL SDL
          ls -la

      - name: Preparar o motor do Sonic CD (RSDKv3)
        run: |
          set -e
          . "$GITHUB_WORKSPACE/.github/baixar.sh"
          test -f RSDKv3-Decompilation/dependencies/all/theoraplay/theoraplay.c
          test -f RSDKv3-Decompilation/dependencies/all/tinyxml2/tinyxml2.cpp
          cd RSDKv3-Decompilation/dependencies/android

          # SDL, libogg e libvorbis sao os mesmos do RSDKv4
          rm -rf SDL libogg libvorbis
          ln -s ../../../dependencies/android/SDL SDL
          ln -s ../../../dependencies/android/libogg libogg
          ln -s ../../../dependencies/android/libvorbis libvorbis

          # libtheora (videos) so o RSDKv3 usa
          baixar theora.tar.gz "" \
            https://downloads.xiph.org/releases/theora/libtheora-1.1.1.tar.gz \
            https://ftp.osuosl.org/pub/xiph/releases/theora/libtheora-1.1.1.tar.gz
          tar xzf theora.tar.gz
          rm -rf libtheora
          mv libtheora-1.1.1 libtheora

          cd ../../android/app/jni
          rm -rf SDL src
          ln -s ../../../dependencies/android/SDL SDL
          ln -s ../../.. src
          ls -la

      - name: Diagnostico (arquivos e CMakeLists)
        run: |
          echo "--- dependencies/android ---"
          ls dependencies/android
          echo "--- jni (RSDKv4) ---"
          ls -la android/app/jni
          echo "--- jni (RSDKv3) ---"
          ls -la RSDKv3-Decompilation/android/app/jni
          echo "--- RSDKv3 dependencies/android ---"
          ls -la RSDKv3-Decompilation/dependencies/android
          echo "--- RSDKv3 dependencies/all ---"
          ls -la RSDKv3-Decompilation/dependencies/all
          echo "--- nome da biblioteca do RSDKv3 ---"
          grep -n "OUTPUT_NAME" RSDKv3-Decompilation/CMakeLists.txt
          echo "--- java SDL no projeto ---"
          find android/app/src -name "SDLActivity*" | head

      - name: Build APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Bibliotecas nativas dentro do APK
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "$APK"
          unzip -l "$APK" | grep -E 'lib/.*\.so' || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Origins-Mobile-apk
          path: android/app/build/outputs/apk/**/*.apk
