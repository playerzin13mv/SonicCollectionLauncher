name: Build Sonic Collection (Android APK)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Baixar dependencias Android (SDL2, libogg, libvorbis)
        run: |
          set -e
          cd dependencies/android

          # uso: baixar ARQUIVO SHA256_OU_VAZIO URL1 URL2 ...
          baixar() {
            destino="$1"; sha="$2"; shift 2
            for url in "$@"; do
              echo "Baixando $url"
              rm -f "$destino"
              if wget -nv --tries=3 --timeout=30 --retry-connrefused --waitretry=5 "$url" -O "$destino"; then
                if [ -z "$sha" ] || echo "$sha  $destino" | sha256sum -c -; then
                  return 0
                fi
                echo "Checksum nao confere, tentando o proximo endereco"
              else
                echo "Falhou, tentando o proximo endereco"
              fi
            done
            echo "ERRO: nao consegui baixar $destino"
            return 1
          }

          baixar sdl.zip "" \
            https://github.com/libsdl-org/SDL/releases/download/release-2.28.3/SDL2-2.28.3.zip
          unzip -q sdl.zip
          rm -rf SDL
          mv SDL2-2.28.3 SDL

          baixar ogg.tar.gz "" \
            https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.gz \
            https://github.com/xiph/ogg/releases/download/v1.3.5/libogg-1.3.5.tar.gz
          tar xzf ogg.tar.gz
          rm -rf libogg
          mv libogg-1.3.5 libogg
          cp config_types.h libogg/include/ogg/config_types.h

          baixar vorbis.tar.gz 0e982409a9c3fc82ee06e08205b1355e5c6aa4c36bca58146ef399621b0ce5ab \
            https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.gz \
            https://github.com/xiph/vorbis/releases/download/v1.3.7/libvorbis-1.3.7.tar.gz \
            https://ftp.osuosl.org/pub/xiph/releases/vorbis/libvorbis-1.3.7.tar.gz
          tar xzf vorbis.tar.gz
          rm -rf libvorbis
          mv libvorbis-1.3.7 libvorbis
          ls

      - name: Criar link SDL dentro de android/app/jni
        run: |
          cd android/app/jni
          rm -rf SDL
          ln -s ../../../dependencies/android/SDL SDL
          ls -la

      - name: Diagnostico (arquivos e CMakeLists)
        run: |
          echo "--- dependencies/android ---"
          ls dependencies/android
          echo "--- jni ---"
          ls -la android/app/jni
          echo "--- java SDL no projeto ---"
          find android/app/src -name "SDLActivity*" | head
          echo "--- CMakeLists.txt linhas 95-140 ---"
          sed -n '95,140p' CMakeLists.txt

      - name: Build APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Collection-apk
          path: android/app/build/outputs/apk/**/*.apk
