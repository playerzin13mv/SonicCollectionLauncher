name: Build Sonic Collection (Android APK)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Baixar dependencias Android (SDL2, libogg, libvorbis)
        run: |
          set -e
          cd dependencies/android
          wget -q https://github.com/libsdl-org/SDL/releases/download/release-2.28.3/SDL2-2.28.3.zip -O sdl.zip
          unzip -q sdl.zip
          rm -rf SDL
          mv SDL2-2.28.3 SDL
          wget -q https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.gz -O ogg.tar.gz
          tar xzf ogg.tar.gz
          rm -rf libogg
          mv libogg-1.3.5 libogg
          cp config_types.h libogg/include/ogg/config_types.h
          wget -q https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.gz -O vorbis.tar.gz
          tar xzf vorbis.tar.gz
          rm -rf libvorbis
          mv libvorbis-1.3.7 libvorbis
          ls

      - name: Criar link SDL dentro de android/app/jni
        run: |
          cd android/app/jni
          rm -rf SDL
          ln -s ../../../dependencies/android/SDL SDL
          ls -la

      - name: Diagnostico (arquivos e CMakeLists)
        run: |
          echo "--- dependencies/android ---"
          ls dependencies/android
          echo "--- jni ---"
          ls -la android/app/jni
          echo "--- java SDL no projeto ---"
          find android/app/src -name "SDLActivity*" | head
          echo "--- CMakeLists.txt linhas 95-140 ---"
          sed -n '95,140p' CMakeLists.txt

      - name: Build APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Collection-apk
          path: android/app/build/outputs/apk/**/*.apk
