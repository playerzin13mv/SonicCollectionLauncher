apply plugin: 'com.android.library'

android {
    ndkVersion "22.1.7171670"
    compileSdkVersion 29
    defaultConfig {
        minSdkVersion 23
        externalNativeBuild {
            cmake {
                arguments "-DAPP_PLATFORM=android-16", "-DANDROID_STL=c++_static", "-DPLATFORM=Android", "-DRETRO_DISABLE_PLUS=false"
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }
    lintOptions {
        abortOnError false
    }
}
